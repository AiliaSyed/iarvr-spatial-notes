name: Build and deploy Hugo site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: '0.149.1'
      TZ: Europe/Berlin
    steps:
      - uses: actions/checkout@v4
      - name: Install Hugo Extended
        run: |
          wget -q -O "${{ runner.temp }}/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"
      - name: Reconstruct Reverse Classroom presentation downloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p static/files/reverse-classroom
          cat assets/presentations/reverse-classroom.pptx.b64.part* | base64 --decode > static/files/reverse-classroom/VR_Spectator_Camera.pptx
          cat assets/presentations/reverse-classroom.pdf.b64.part* | base64 --decode > static/files/reverse-classroom/VR_Spectator_Camera.pdf
          echo "9faf2d87bc31b66f154c9f9f689ba1b237e4028af35c951980ee65753c194197  static/files/reverse-classroom/VR_Spectator_Camera.pptx" | sha256sum --check
          echo "08fe99258fcb3a10152df43ecc52ef708b17d0038ffda3d166e830b7280ca1d0  static/files/reverse-classroom/VR_Spectator_Camera.pdf" | sha256sum --check
      - name: Build site
        run: hugo --minify
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
