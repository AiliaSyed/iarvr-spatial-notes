<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d1224">
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
  <title>{{ if .IsHome }}Spatial Notes — IARVR 2026/27{{ else }}{{ .Title }} · Spatial Notes{{ end }}</title>
  <link rel="icon" href="{{ "images/favicon.svg" | relURL }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ "css/site.css" | relURL }}">
  <script src="{{ "js/site.js" | relURL }}" defer></script>
</head>
<body>
  <div class="read-progress" aria-hidden="true"></div>
  {{ partial "header.html" . }}
  <main id="main-content">{{ block "main" . }}{{ end }}</main>
  {{ partial "footer.html" . }}
</body>
</html>
