    <text x="694" y="113" font-size="24" letter-spacing="2" fill="#e0d5ff">EXTERNAL THIRD PERSON</text>
    <text x="500" y="484" font-size="56" fill="#f2f7ff">VR SPECTATOR CAMERA</text>
