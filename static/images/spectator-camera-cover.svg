<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc">
  <title id="title">VR Spectator Camera</title>
  <desc id="desc">Two views of a VR scene: a smoothed first-person view and an external view of the player.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#101a34"/>
      <stop offset=".53" stop-color="#242d55"/>
      <stop offset="1" stop-color="#163d50"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#9c80f4" stop-opacity=".26"/>
      <stop offset="1" stop-color="#9c80f4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="view" x2="0" y2="1">
      <stop stop-color="#253958"/>
      <stop offset="1" stop-color="#152541"/>
    </linearGradient>
    <linearGradient id="mint" x2="1" y2="1">
      <stop stop-color="#d2f9ff"/>
      <stop offset="1" stop-color="#76ddd3"/>
    </linearGradient>
    <linearGradient id="violet" x2="1" y2="1">
      <stop stop-color="#e8ddff"/>
      <stop offset="1" stop-color="#a99af5"/>
    </linearGradient>
  </defs>
